        });
        tongYThuongP2 += dungY;
        diemP2 += thangP2[dungY] || 0;
      });
      diemP2 = Number(diemP2.toFixed(2));

      // Phần III: 6 câu, mỗi câu 0,5 điểm => tối đa 3,0 điểm
      let dungP3 = 0;
      phan3Data.forEach(item => {
        const raw = document.getElementById(item.id).value.trim().replace(",", ".");
        chiTiet.push(`${item.label}: ${raw || "Trống"}`);
        const num = parseFloat(raw);
        if (!Number.isNaN(num) && Math.abs(num - item.ans) <= 0.05) {
          dungP3++;
        }
      });
      const diemP3 = Number((dungP3 * 0.5).toFixed(2));

      const tongDiem = Number((diemP1 + diemP2 + diemP3).toFixed(2));

      const btn = document.getElementById("btnNop");
      btn.disabled = true;
      btn.textContent = "ĐANG GỬI KẾT QUẢ VỀ GOOGLE SHEET...";

      const payload = {
        hoTen,
        lop,
        maDe: MA_DE,
        diemP1,
        diemP2,
        diemP3,
        tongDiem,
        chiTiet: chiTiet.join(" | ")
      };

      try {
        await fetch(SHEET_WEBAPP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        btn.textContent = "ĐÃ NỘP BÀI THÀNH CÔNG";
        btn.classList.remove("bg-emerald-600", "hover:bg-emerald-700");
        btn.classList.add("bg-blue-600");

        const box = document.getElementById("ketQuaBox");
        box.classList.remove("hidden");
        box.innerHTML = `
          <h3 class="text-lg font-bold text-emerald-900 mb-2">Đã chấm điểm và gửi kết quả về Google Sheet</h3>
          <p class="text-sm text-slate-700"><strong>Học sinh:</strong> ${hoTen} — <strong>Lớp:</strong> ${lop} (${MA_DE})</p>
          <ul class="list-disc ml-5 mt-2 space-y-1 text-sm text-slate-800">
            <li>Điểm Phần I: <strong>${diemP1} / 3.0</strong> (${dungP1}/${phan1Data.length} câu đúng)</li>
            <li>Điểm Phần II: <strong>${diemP2} / 4.0</strong> (${tongYThuongP2}/16 ý đúng)</li>
            <li>Điểm Phần III: <strong>${diemP3} / 3.0</strong> (${dungP3}/${phan3Data.length} câu đúng)</li>
          </ul>
          <p class="text-base font-bold text-emerald-900 mt-3">Tổng điểm: ${tongDiem} / 10.0</p>
        `;
      } catch (err) {
        alert("Gửi dữ liệu chưa thành công. Vui lòng thử lại.");
        btn.disabled = false;
        btn.textContent = "NỘP BÀI & GỬI KẾT QUẢ VỀ GOOGLE SHEET";
      }
    }
  </script>
</body>
</html>
