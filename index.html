<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cổng Khảo Thí Trực Tuyến - Môn Toán (Khối 10, 11, 12)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f8fafc;
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px rgba(15, 23, 42, 0.12);
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-gradient-to-r from-slate-900 via-blue-900 to-indigo-900 text-white py-9 px-4 shadow">
    <div class="max-w-6xl mx-auto text-center">
      <p class="text-xs sm:text-sm font-semibold uppercase tracking-widest text-blue-200">
        Chương trình GDPT 2018 • Hệ thống khảo thí & luyện tập môn Toán
      </p>
      <h1 class="text-2xl sm:text-4xl font-extrabold mt-2">
        CỔNG KHẢO THÍ TRỰC TUYẾN — KHỐI 10, 11, 12
      </h1>
      <p class="text-sm sm:text-base text-blue-100 mt-2">
        Giữa kỳ 1 • Cuối kỳ 1 • Giữa kỳ 2 • Cuối kỳ 2
      </p>
    </div>
  </header>

  <!-- Nội dung chính -->
  <main class="max-w-6xl w-full mx-auto px-4 py-8 flex-grow space-y-7">

    <!-- BƯỚC 1: CHỌN KHỐI -->
    <section class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">
        Bước 1: Chọn khối lớp
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="grade-buttons">
        <button type="button" data-grade="10" onclick="chonKhoi('10')"
          class="grade-btn p-4 rounded-xl border-2 text-left transition border-slate-200 hover:border-blue-400">
          <div class="font-extrabold text-lg text-slate-900">📘 Toán Khối 10</div>
          <div class="text-xs text-slate-500 mt-0.5">GK1 • CK1 • GK2 • CK2</div>
        </button>
        <button type="button" data-grade="11" onclick="chonKhoi('11')"
          class="grade-btn p-4 rounded-xl border-2 text-left transition border-slate-200 hover:border-indigo-400">
          <div class="font-extrabold text-lg text-slate-900">📗 Toán Khối 11</div>
          <div class="text-xs text-slate-500 mt-0.5">GK1 • CK1 • GK2 • CK2</div>
        </button>
        <button type="button" data-grade="12" onclick="chonKhoi('12')"
          class="grade-btn p-4 rounded-xl border-2 text-left transition border-slate-200 hover:border-emerald-400">
          <div class="font-extrabold text-lg text-slate-900">📕 Toán Khối 12</div>
          <div class="text-xs text-slate-500 mt-0.5">GK1 • CK1 • GK2 • CK2</div>
        </button>
      </div>
    </section>

    <!-- BƯỚC 2: CHỌN MỐC KIỂM TRA (GK1, CK1, GK2, CK2) -->
    <section id="milestone-section" class="hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
        <h2 id="selected-grade-heading" class="text-lg font-extrabold text-slate-900"></h2>
        <button type="button" onclick="resetHeThong()"
          class="text-xs font-semibold px-3
